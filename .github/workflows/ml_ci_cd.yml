name: Modelops deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  repository_dispatch:
    types: [ml_ci_cd]
    
jobs:
  ml_ci_cd:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
        
      - name: Check Python version
        run: python --version
      - name: pip install
        run: pip install -r requirements.txt
      - name: download dataset
        run: wget -O data/heart-disease.csv ${{github.event.client_payload.dataseturl}}
      - name: cat dataset
        run: cat data/heart-disease.csv
      - name: train model
        run: python model/train.py
      - name: docker build
        run: docker build -t ${{secrets.DOCKER_USER}}/${{secrets.MODEL_NAME}}:${{github.event.client_payload.sha}} .
      - name: docker login
        env:
          DOCKER_USER: ${{secrets.DOCKER_USER}}
          DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
        run: |
          docker login -u $DOCKER_USER -p $DOCKER_PASSWORD
      - name: docker Push
        run: docker push ${{secrets.DOCKER_USER}}/${{secrets.MODEL_NAME}}:${{github.event.client_payload.sha}}
      - name: show images
        run: docker images
