name: Modelops deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  repository_dispatch:
    types: [ml_ci_cd]
    
jobs:
  ml_ci_cd:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.8]
    steps:
      - uses: actions/cheackot@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
        
      - name: Check Python version
        run: python --version
